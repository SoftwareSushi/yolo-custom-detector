<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Inference speed on an Apple M4 by export format</title><desc id="d">Frames per second over 200 test images, including image loading, preprocessing and postprocessing: PyTorch (MPS) 43.6 FPS (23.0 ms), PyTorch (CPU) 37.8 FPS (26.4 ms), CoreML 142.1 FPS (7.0 ms), ONNX Runtime (CPU) 54.2 FPS (18.4 ms).</desc><style>.k{font:700 15px DejaVu Sans,Arial,sans-serif;letter-spacing:2px;fill:#9A2F06}.h{font:700 34px DejaVu Sans,Arial,sans-serif;fill:#2A1420}.s{font:400 20px DejaVu Sans,Arial,sans-serif;fill:#5B4650}
.n{font:700 22px DejaVu Sans,Arial,sans-serif;fill:#2A1420}.b{font:400 17px DejaVu Sans,Arial,sans-serif;fill:#3A2830}.l{font:700 15px DejaVu Sans,Arial,sans-serif;fill:#9A2F06}.ax{font:400 15px DejaVu Sans,Arial,sans-serif;fill:#5B4650}.v{font:700 18px DejaVu Sans,Arial,sans-serif;fill:#2A1420}</style><rect width="1600" height="900" fill="#FBF6F1"/><text x="70" y="78" class="k">CUSTOM YOLO DETECTOR · SPEED ON THE M4</text><text x="70" y="126" class="h">The same weights, four ways to run them</text><text x="70" y="164" class="s">Images per second over the 200 test images, after 10 warm-up runs. Includes loading, pre- and postprocessing.</text><text x="70" y="288" class="n">PyTorch (MPS)</text><rect x="420" y="240" width="276.1" height="72" rx="10" fill="#7A2E59"/><text x="716.1" y="286" class="v">43.6 FPS · 23.0 ms</text><text x="70" y="438" class="n">PyTorch (CPU)</text><rect x="420" y="390" width="239.4" height="72" rx="10" fill="#7A2E59"/><text x="679.4" y="436" class="v">37.8 FPS · 26.4 ms</text><text x="70" y="588" class="n">CoreML</text><rect x="420" y="540" width="900.0" height="72" rx="10" fill="#D9480F"/><text x="1340.0" y="586" class="v">142.1 FPS · 7.0 ms</text><text x="70" y="738" class="n">ONNX Runtime (CPU)</text><rect x="420" y="690" width="343.3" height="72" rx="10" fill="#E8A33D"/><text x="783.3" y="736" class="v">54.2 FPS · 18.4 ms</text></svg>