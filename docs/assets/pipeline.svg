<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img"><title>Custom YOLO pipeline: dataset, label, train, export, infer</title><style>.k{font:700 15px DejaVu Sans,Arial,sans-serif;letter-spacing:2px;fill:#9A2F06}.h{font:700 34px DejaVu Sans,Arial,sans-serif;fill:#2A1420}.s{font:400 20px DejaVu Sans,Arial,sans-serif;fill:#5B4650}
.n{font:700 22px DejaVu Sans,Arial,sans-serif;fill:#2A1420}.b{font:400 17px DejaVu Sans,Arial,sans-serif;fill:#3A2830}.l{font:700 15px DejaVu Sans,Arial,sans-serif;fill:#9A2F06}.c{fill:#fff;stroke:#EBD3C4;stroke-width:2}</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9A2F06"/></marker></defs><rect width="1600" height="900" fill="#FBF6F1"/><text x="70" y="78" class="k">CUSTOM YOLO DETECTOR · PIPELINE</text><text x="70" y="126" class="h">From a folder of images to boxes on live video</text><text x="70" y="164" class="s">Steps 1 to 4 run once on the Mac; step 5 runs for every frame.</text><rect x="50" y="250" width="1500" height="420" rx="22" fill="#F6E7DC" stroke="#D9480F" stroke-width="2" stroke-dasharray="10 8"/><text x="78" y="288" class="l">ON THE MAC (APPLE SILICON)</text><rect x="78" y="320" width="262" height="300" rx="18" class="c"/><rect x="78" y="320" width="262" height="8" rx="4" fill="#D9480F"/><path d="M278 358V346H290M302 346H314V358M278 370V382H290M302 382H314V370" fill="none" stroke="#D9480F" stroke-width="3"/><text x="102" y="370" class="l">1 · DATASET</text><text x="102" y="406" class="n">Collect images</text><text x="102" y="444" class="b">A small public set</text><text x="102" y="469" class="b">with one or two</text><text x="102" y="494" class="b">custom classes.</text><line x1="342" y1="470" x2="368" y2="470" stroke="#9A2F06" stroke-width="3" marker-end="url(#a)"/><rect x="372" y="320" width="262" height="300" rx="18" class="c"/><rect x="372" y="320" width="262" height="8" rx="4" fill="#E8A33D"/><path d="M572 358V346H584M596 346H608V358M572 370V382H584M596 382H608V370" fill="none" stroke="#E8A33D" stroke-width="3"/><text x="396" y="370" class="l">2 · LABEL</text><text x="396" y="406" class="n">Draw boxes</text><text x="396" y="444" class="b">One box per object,</text><text x="396" y="469" class="b">saved as YOLO txt</text><text x="396" y="494" class="b">(class x y w h).</text><line x1="636" y1="470" x2="662" y2="470" stroke="#9A2F06" stroke-width="3" marker-end="url(#a)"/><rect x="666" y="320" width="262" height="300" rx="18" class="c"/><rect x="666" y="320" width="262" height="8" rx="4" fill="#7A2E59"/><path d="M866 358V346H878M890 346H902V358M866 370V382H878M890 382H902V370" fill="none" stroke="#7A2E59" stroke-width="3"/><text x="690" y="370" class="l">3 · TRAIN</text><text x="690" y="406" class="n">Fine-tune</text><text x="690" y="444" class="b">Start from pretrained</text><text x="690" y="469" class="b">weights; train on</text><text x="690" y="494" class="b">Apple GPU (MPS).</text><line x1="930" y1="470" x2="956" y2="470" stroke="#9A2F06" stroke-width="3" marker-end="url(#a)"/><rect x="960" y="320" width="262" height="300" rx="18" class="c"/><rect x="960" y="320" width="262" height="8" rx="4" fill="#E8A33D"/><path d="M1160 358V346H1172M1184 346H1196V358M1160 370V382H1172M1184 382H1196V370" fill="none" stroke="#E8A33D" stroke-width="3"/><text x="984" y="370" class="l">4 · EXPORT</text><text x="984" y="406" class="n">Package model</text><text x="984" y="444" class="b">Export to CoreML</text><text x="984" y="469" class="b">for the Mac and</text><text x="984" y="494" class="b">ONNX for other hosts.</text><line x1="1224" y1="470" x2="1250" y2="470" stroke="#9A2F06" stroke-width="3" marker-end="url(#a)"/><rect x="1254" y="320" width="262" height="300" rx="18" class="c"/><rect x="1254" y="320" width="262" height="8" rx="4" fill="#D9480F"/><path d="M1454 358V346H1466M1478 346H1490V358M1454 370V382H1466M1478 382H1490V370" fill="none" stroke="#D9480F" stroke-width="3"/><text x="1278" y="370" class="l">5 · INFER</text><text x="1278" y="406" class="n">Detect live</text><text x="1278" y="444" class="b">Run on a webcam</text><text x="1278" y="469" class="b">stream and draw</text><text x="1278" y="494" class="b">boxes per frame.</text><path d="M1430 680V740H209V680" fill="none" stroke="#7A2E59" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#a)"/><text x="560" y="780" class="l">Weak classes? Add and relabel images, then train again.</text></svg>